name: Build patched HS2 ShalltyUtils

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ShalltyUtils v1.3.1
        uses: actions/checkout@v4
        with:
          repository: Lusiocc/ShalltyUtils
          ref: v1.3.1
          path: ShalltyUtils

      - name: Checkout HSPlugins r2.25
        uses: actions/checkout@v4
        with:
          repository: IllusionMods/HSPlugins
          ref: r2.25
          path: HSPlugins
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Build HS2 HSPlugins dependencies
        working-directory: HSPlugins
        run: |
          set -euxo pipefail

          dotnet build Timeline.HS2/Timeline.HS2.csproj -c Release
          dotnet build HS2PE/PoseEditor.HS2.csproj -c Release
          dotnet build NodesConstraints.HS2/NodesConstraints.HS2.csproj -c Release

      - name: Patch HS2 animation baking
        shell: pwsh
        run: |
          $file = "ShalltyUtils/ShalltyUtils.Core/TimelineBaking/ShalltyUtils.BakeAnimation.cs"
          $c = Get-Content $file -Raw

          # ------------------------------------------------------------
          # 1. Make IK target matching case-insensitive
          # ------------------------------------------------------------

          $oldSwitch = 'switch (name)'
          $newSwitch = 'switch ((name ?? string.Empty).ToLowerInvariant())'

          if (-not $c.Contains($oldSwitch)) {
            throw "ShouldBakeBones switch line not found"
          }

          $c = $c.Replace($oldSwitch, $newSwitch)

          # ------------------------------------------------------------
          # 2. Replace Koikatsu IK names with the actual HS2 IK names
          #
          # HS2:
          #   hips      = f_t_hips
          #   shoulder  = f_t_shoulder
          #   elbow     = f_t_elbo
          #   hand      = f_t_arm
          #   hip/thigh = f_t_thigh
          #   knee      = f_t_knee
          #   foot      = f_t_leg
          # ------------------------------------------------------------

          $replacements = @{
            'cf_t_hips(work)'       = 'f_t_hips(work)'

            'cf_t_shoulder_L(work)' = 'f_t_shoulder_l(work)'
            'cf_t_elbo_L(work)'     = 'f_t_elbo_l(work)'
            'cf_t_hand_L(work)'     = 'f_t_arm_l(work)'

            'cf_t_shoulder_R(work)' = 'f_t_shoulder_r(work)'
            'cf_t_elbo_R(work)'     = 'f_t_elbo_r(work)'
            'cf_t_hand_R(work)'     = 'f_t_arm_r(work)'

            'cf_t_waist_L(work)'    = 'f_t_thigh_l(work)'
            'cf_t_knee_L(work)'     = 'f_t_knee_l(work)'
            'cf_t_leg_L(work)'      = 'f_t_leg_l(work)'

            'cf_t_waist_R(work)'    = 'f_t_thigh_r(work)'
            'cf_t_knee_R(work)'     = 'f_t_knee_r(work)'
            'cf_t_leg_R(work)'      = 'f_t_leg_r(work)'
          }

          foreach ($oldName in $replacements.Keys) {
            if (-not $c.Contains($oldName)) {
              throw "Expected animation bake target not found: $oldName"
            }

            $c = $c.Replace($oldName, $replacements[$oldName])
          }

          # ------------------------------------------------------------
          # 3. Make head/finger FK matching case-insensitive
          # ------------------------------------------------------------

          $oldFinger = 'transformNames.Contains(targetInfo.guideObject.transformTarget.name)'
          $newFinger = 'transformNames.Contains(targetInfo.guideObject.transformTarget.name, StringComparer.OrdinalIgnoreCase)'

          if (-not $c.Contains($oldFinger)) {
            throw "FK/finger matching expression not found"
          }

          $c = $c.Replace($oldFinger, $newFinger)

          # ------------------------------------------------------------
          # 4. Log the actual HS2 IK targets every time Bake is pressed
          # ------------------------------------------------------------

          $oldList = '            List<Interpolable> interpolableList = new List<Interpolable>();'

          $newList = @(
            '            List<Interpolable> interpolableList = new List<Interpolable>();',
            '',
            '            ShalltyUtils.Logger.LogMessage("Animation Baking detected IK targets: " + string.Join(", ", firstChar.listIKTarget.Select(x => x.guideObject.transformTarget.name).ToArray()));'
          ) -join "`r`n"

          if (-not $c.Contains($oldList)) {
            throw "Interpolable list initialization was not found"
          }

          $c = $c.Replace($oldList, $newList)

          # ------------------------------------------------------------
          # 5. Replace silent failure with useful logging
          # ------------------------------------------------------------

          $oldEmpty = '            if (interpolableList.Count == 0) return;'

          if (-not $c.Contains($oldEmpty)) {
            throw "Silent animation-bake return was not found"
          }

          $newEmpty = @(
            '            if (interpolableList.Count == 0)',
            '            {',
            '                ShalltyUtils.Logger.LogWarning("Animation Baking: no enabled HS2 IK/FK bake targets matched.");',
            '                ShalltyUtils.Logger.LogMessage("Animation Baking IK targets: " + string.Join(", ", firstChar.listIKTarget.Select(x => x.guideObject.transformTarget.name).ToArray()));',
            '                return;',
            '            }'
          ) -join "`r`n"

          $c = $c.Replace($oldEmpty, $newEmpty)

          Set-Content $file $c -Encoding UTF8

          Write-Host "HS2 animation baking patch applied successfully."

      - name: Build patched HS2 ShalltyUtils
        working-directory: ShalltyUtils
        run: |
          set -euxo pipefail

          dotnet build ShalltyUtils.HS2/ShalltyUtils.HS2.csproj -c Release

      - name: Verify patched DLL
        run: |
          test -f ShalltyUtils/bin/build/ShalltyUtils.HS2/HS2_ShalltyUtils.dll

          echo "PATCHED DLL:"
          ls -lh ShalltyUtils/bin/build/ShalltyUtils.HS2/HS2_ShalltyUtils.dll

          echo "RELEASE OUTPUT:"
          ls -lh ShalltyUtils/bin/out/

      - name: Upload patched DLL
        uses: actions/upload-artifact@v4
        with:
          name: HS2_ShalltyUtils-1.3.1-HS2BodyBakeFix
          path: |
            ShalltyUtils/bin/build/ShalltyUtils.HS2/HS2_ShalltyUtils.dll
            ShalltyUtils/bin/out/HS2_ShalltyUtils_v1.3.1.zip
          if-no-files-found: error
